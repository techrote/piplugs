name: CALS OMP native skill and plugin smoke

on:
  pull_request:
    paths:
      - '.github/workflows/cals-omp-smoke.yml'
      - '.omp/skills/landscape-studio/**'
      - 'plugins/cals/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-skill-discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Install pinned OMP CLI
        shell: bash
        run: |
          set -euo pipefail
          bun install --global '@oh-my-pi/pi-coding-agent@19.1.0'
          command -v omp
          omp --version
      - name: Verify native project skill discovery without model calls
        shell: bash
        run: |
          set -euo pipefail
          omp skill list --json > "$RUNNER_TEMP/cals-skills.json"
          python3 - "$RUNNER_TEMP/cals-skills.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as f:
              data = json.load(f)
          def walk(x):
              if isinstance(x, dict):
                  yield x
                  for v in x.values(): yield from walk(v)
              elif isinstance(x, list):
                  for v in x: yield from walk(v)
          hits = [d for d in walk(data) if d.get('name') == 'landscape-studio']
          assert hits, 'landscape-studio project skill not found'
          print('OMP PROJECT SKILL DISCOVERED', hits[0])
          PY
      - name: Test optional OMP extension command registration
        shell: bash
        run: bun test plugins/cals/tests/extension.test.ts
      - name: Verify plugin link and independent skill discovery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cals-independent-consumer"
          cd "$RUNNER_TEMP/cals-independent-consumer"
          omp plugin link "$GITHUB_WORKSPACE/plugins/cals"
          omp plugin list
          omp skill list --json > "$RUNNER_TEMP/cals-packaged-skills.json"
          python3 - "$RUNNER_TEMP/cals-packaged-skills.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as f:
              data = json.load(f)
          def walk(x):
              if isinstance(x, dict):
                  yield x
                  for v in x.values(): yield from walk(v)
              elif isinstance(x, list):
                  for v in x: yield from walk(v)
          hits = [d for d in walk(data) if d.get('name') == 'landscape-studio']
          assert any(h.get('source', '').startswith('omp-plugins:') and
                     str(h.get('filePath', '')).endswith('/skills/landscape-studio/SKILL.md')
                     for h in hits), hits
          print('OMP PACKAGED SKILL DISCOVERED', hits[0])
          PY
      - name: Verify OMP discovers read-only CALS task agents
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/cals-independent-consumer"
          export CALS_OMP_ENTRY="$(readlink -f "$(command -v omp)")"
          bun - <<'JS'
          import { dirname, join } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const entry = process.env.CALS_OMP_ENTRY;
          if (!entry?.endsWith('/src/cli.ts')) throw new Error('Unrecognized OMP CLI layout: ' + entry);
          const discovery = await import(pathToFileURL(join(dirname(entry),'task','discovery.ts')).href);
          const result = await discovery.discoverAgents(process.cwd());
          const expected = ['cals-architect','cals-environment','cals-traversal','cals-critic'];
          for (const name of expected) {
            const agent = result.agents.find(a => a.name === name);
            if (!agent) throw new Error('OMP task agent missing: ' + name);
            if (!Array.isArray(agent.tools) || agent.tools.length === 0 ||
                agent.tools.some(t => !['read','grep','find'].includes(t))) {
              throw new Error('Unexpected privileged tool in ' + name + ': ' + JSON.stringify(agent.tools));
            }
            console.log('OMP AGENT DISCOVERED', name, agent.tools.join(','));
          }
          JS
      - name: Retain exact smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cals-omp-smoke-${{ github.run_number }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/cals-skills.json
            ${{ runner.temp }}/cals-packaged-skills.json
